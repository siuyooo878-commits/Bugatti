 const lab=(s,v,c='#7fe3ff')=>{const[x,y]=proj(v);g.fillStyle='rgba(0,0,0,.65)';g.font=`700 ${28*k}px system-ui`;const w=g.measureText(s).width+24*k;g.fillRect(x-w/2,y-22*k,w,40*k);g.strokeStyle=c;g.strokeRect(x-w/2,y-22*k,w,40*k);g.fillStyle=c;g.fillText(s,x,y+8*k)};
 if(t>=7.8&&t<15)lab('ACTIVE REAR WING → AIRBRAKE',wingC.clone().add(w3(0,.5,0)),'#ffd23b');
 if(t>=15&&t<23)lab('DRAG ← opposes motion',w3(wingC.x-.2-(.5),wingC.y+1.5,wingC.z),'#ff6b6b');
 if(t>=24&&t<31){lab('TYRE + WHEEL',Wp(0,.5,-.2));lab('DISC (rotates, explanatory model)',Wp(0,-.1,0),'#ffd23b');lab('CALIPER (fixed)',Wp(0,.45,.1).add(w3(0,.25,0)),'#7fe3ff');lab('PADS clamp disc',Wp(.1,.18,0),'#ff9f4a')}
 if(t>=39&&t<46){lab('CONTACT PATCH',w3(Wc.x,0,Wc.z),'#38e0ff');lab('Braking force → road',w3(Wc.x-.7,.2,Wc.z),'#ffd23b');txt('DISC + PADS make torque · TYRES pass force to the road',540,980,28,'#fff',600)}
 if(t>=46&&t<54){const u=t-46;if(u<2.6)lab('1  AIRBRAKE',wingC.clone().add(w3(0,.5,0)),'#ffd23b');else if(u<5.2)lab('2  CARBON-CERAMIC BRAKES',Wc.clone().add(w3(0,.55,0)),'#ff9f4a');else lab('3  TYRE–ROAD CONTACT',w3(Wc.x,0,Wc.z),'#38e0ff');txt('ABS keeps wheels rolling, not locked',540,980,28,'#cfd8e6',500)}
 if(t>=70){const u=cl((t-70)/1.5);g.globalAlpha=u;['REAR-WING AIRBRAKE','CARBON-CERAMIC BRAKES','TYRE–ROAD CONTACT'].forEach((s,i)=>{g.fillStyle='rgba(0,0,0,.6)';g.fillRect(200*k,1000*k+i*70*k,680*k,56*k);txt(s,540,1040+i*70,32,['#ffd23b','#ff9f4a','#38e0ff'][i])});
  txt('400 KM/H. THREE BRAKING SYSTEMS. ONE CONTROLLED STOP.',540,1240,30,'#fff');g.globalAlpha=1}
 // caption
 const n=NAR[sn],ss=n.match(/[^.?]+[.?]?/g).map(s=>s.trim()).filter(Boolean),tot=ss.reduce((a,s)=>a+s.length,0),u=(t-SC[sn])/(SC[sn+1]-SC[sn])*1.0;let acc=0,cur=ss[ss.length-1];
 for(const s of ss){acc+=s.length/tot;if(u<acc*0.97){cur=s;break}}
 g.font=`700 ${46*k}px system-ui,sans-serif`;const ls=wrap(cur,900*k),bh=ls.length*60*k+30*k,by=H-110*k-bh;g.fillStyle='rgba(0,0,0,.62)';g.fillRect(60*k,by,960*k,bh);g.fillStyle='#fff';ls.forEach((l,i)=>g.fillText(l,W_/2,by+58*k+i*60*k));

function frame(t){const S=setState(t);renderer.render(scene,cam);draw(t,S)}
// ---------- audio (shared by live + offline)
const seedNoise=ctx=>{const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=b.getChannelData(0);let s=12345;for(let i=0;i<d.length;i++){s=(s*1664525+1013904223)>>>0;d[i]=s/2147483648-1}return b};
const curve=(fn,t0,t1,n=240)=>Float32Array.from({length:n},(_,i)=>fn(lerp(t0,t1,i/(n-1))));
function buildAudio(ctx,dest,t0){const nodes=[],D=DUR-t0;if(D<=0.05)return nodes;const now=ctx.currentTime+.05;
 const G=(fn)=>{const g_=ctx.createGain();g_.gain.setValueAtTime(0,now);g_.gain.setValueCurveAtTime(curve(fn,t0,DUR),now,D);return g_};
 const sp=t=>veh(t).v/V0;
 if(engBuf){const ED=engBuf.duration;const eg=t=>{const e=.3+.7*Math.pow(sp(t),.7);return e*(1-.85*ease(cl((t-75.5)/2.5)))*ease(cl(t/.4))};
  const mk=(off,when,gfn)=>{const s=ctx.createBufferSource();s.buffer=engBuf;const gg=G(t=>eg(t)*gfn(t));s.connect(gg).connect(dest);s.start(now+when,off);nodes.push(s)};
  const cf=ED-3; // main track until ED, second pass (mid-section of same recording) crossfades in for the tail
  if(t0<ED)mk(Math.min(t0,ED-.01),0,t=>1-ease(cl((t-cf)/3)));
  if(DUR>cf)mk(Math.max(25,0)+Math.max(0,t0-cf),Math.max(0,cf-t0),t=>ease(cl((t-cf)/3)))}
 const nb=seedNoise(ctx);const nz=(fq,q,fn)=>{const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;const f_=ctx.createBiquadFilter();f_.type='bandpass';f_.frequency.value=fq;f_.Q.value=q;s.connect(f_).connect(G(fn)).connect(dest);s.start(now);nodes.push(s)};
 nz(700,.6,t=>.22*Math.pow(sp(t),1.6));nz(120,.8,t=>.1*Math.pow(sp(t),1.2));
 nz(2600,2,t=>{const u=(t-TB)/2.5;return u>0&&u<1?.07*Math.sin(u*Math.PI):0});
 nz(3200,1.2,t=>.06*brk(t)*Math.min(1,sp(t)*3)*(sp(t)>.02?1:0));nz(1500,1,t=>.05*brk(t)*Math.min(1,sp(t)*2));
 const comp=1;return nodes}
let master,liveNodes=[],playing=false,tAt=0,t0wall=0;
function audioStop(){liveNodes.forEach(n=>{try{n.stop()}catch(e){}});liveNodes=[]}
async function audioStart(t){audioStop();if(!$('tSnd').checked||!actx)return;await actx.resume();if(!master){master=actx.createGain();const c=actx.createDynamicsCompressor();master.connect(c).connect(actx.destination)}master.gain.value=+$('vol').value;liveNodes=buildAudio(actx,master,t)}
// ---------- controls
SC.slice(0,10).forEach((s,i)=>{const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>seek(s);$('scn').appendChild(b)});
function seek(t){tNow=cl(t,0,DUR-1/FPS);t0wall=performance.now()-tNow*1000;if(playing)audioStart(tNow);}
function setPlay(p){playing=p;$('play').textContent=p?'⏸ Pause':'▶ Play';if(p){if(tNow>=DUR-.05)tNow=0;t0wall=performance.now()-tNow*1000;audioStart(tNow)}else audioStop()}
$('play').onclick=()=>setPlay(!playing);$('restart').onclick=()=>{seek(0);setPlay(true)};
$('scrub').oninput=e=>seek(+e.target.value);
$('tSnd').onchange=()=>playing&&($('tSnd').checked?audioStart(tNow):audioStop());$('vol').oninput=()=>master&&(master.gain.value=+$('vol').value);
$('insp').onclick=e=>{inspect=!inspect;e.target.classList.toggle('on',inspect);orbit.enabled=inspect;if(inspect){cam.position.set(-6+carRoot.position.x,2.5,-6);orbit.target.set(carRoot.position.x,.7,0)}};
$('rcam').onclick=()=>{inspect=false;orbit.enabled=false;$('insp').classList.remove('on')};

function loop(){if(!exporting){if(playing){tNow=(performance.now()-t0wall)/1000;if(tNow>=DUR){tNow=DUR-1/FPS;setPlay(false)}}
 if(inspect)orbit.update();frame(tNow);$('scrub').value=tNow;$('tm').textContent=tNow.toFixed(1)}requestAnimationFrame(loop)}
$('load').remove();loop();
// ---------- offline export (frame-by-frame, WebCodecs via Mediabunny, AAC audio muxed)
let exporting=false,cancelFlag=false;const msg=s=>$('msg').textContent=s;
$('esz').onchange=()=>$('exp').textContent=$('esz').value==='1080'?'EXPORT FULL HD MP4 — 1080 × 1920':'EXPORT MP4 — 720 × 1280';
$('cancel').onclick=()=>cancelFlag=true;
$('exp').onclick=async()=>{if(exporting)return;exporting=true;cancelFlag=false;setPlay(false);$('exp').disabled=true;$('cancel').disabled=false;
 const W_=+$('esz').value,H_=W_*16/9,prevW=out.width,prevT=tNow,nF=Math.round(DUR*FPS);let out_=null;
 try{msg('1/9 Preparing export renderer…');const MB=await import('mediabunny');
  if(!engBuf)throw new Error('Engine audio not decoded — refusing to export with a substituted sound.');
  msg('2/9 Mixing audio offline (OfflineAudioContext)…');
  const oc=new OfflineAudioContext(2,48000*DUR,48000);const om=oc.createGain();om.gain.value=.9;const cp=oc.createDynamicsCompressor();om.connect(cp).connect(oc.destination);
  const eb=engBuf;const saved=engBuf;buildAudio(oc,om,0);const abuf=await oc.startRendering();
  size(W_,H_);let fmtName='mp4';
  const tryFmt=async(webm)=>{const o=new MB.Output({format:webm?new MB.WebMOutputFormat():new MB.Mp4OutputFormat(),target:new MB.BufferTarget()});
   const vs=new MB.CanvasSource(out,{codec:webm?'vp9':'avc',bitrate:W_>=1080?16e6:8e6});o.addVideoTrack(vs,{frameRate:FPS});
   const as=new MB.AudioBufferSource({codec:webm?'opus':'aac',bitrate:192e3});o.addAudioTrack(as);await o.start();return{o,vs,as}};
  try{out_=await tryFmt(false)}catch(e){fmtName='webm';msg('MP4/H.264+AAC unsupported here ('+e.message+') — trying WebM VP9+Opus…');out_=await tryFmt(true)}
  await out_.as.add(abuf);out_.as.close();
  for(let n=0;n<nF;n++){if(cancelFlag)throw new Error('cancelled');frame(n/FPS);await out_.vs.add(n/FPS,1/FPS);
   if(n%3==0){$('pr').value=n/nF;msg(`3/9 Rendering + encoding frame ${n+1}/${nF} (${(n/nF*100).toFixed(0)}%)`);await new Promise(r=>setTimeout(r))}}
  out_.vs.close();msg('Muxing / finalizing…');await out_.o.finalize();const buf=out_.o.target.buffer;if(!buf||!buf.byteLength)throw new Error('empty output');
  const blob=new Blob([buf],{type:fmtName==='mp4'?'video/mp4':'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`chiron-400kmh-brake-${W_}x${H_}.${fmtName}`;a.click();
  $('pr').value=1;msg(`Done: ${a.download} · ${(blob.size/1048576).toFixed(1)} MB · ${DUR}s · ${nF} frames @${FPS} fps · audio AAC/Opus track muxed.`)
 }catch(e){msg(e.message==='cancelled'?'Export cancelled — no file produced.':'Export failed: '+e.message);try{await out_?.o.cancel?.()}catch(_){}}
 finally{exporting=false;$('exp').disabled=false;$('cancel').disabled=true;size(+$('q').value,+$('q').value*16/9);tNow=prevT}};
